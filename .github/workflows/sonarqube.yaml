
name: Node.js SonarQube Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run backend tests
        working-directory: backend
        run: npm test

      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present

        - name: Verify SonarQube URL
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        shell: bash
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL is empty."
            echo "Create it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          case "$SONAR_HOST_URL" in
            https://*) echo "SonarQube HTTPS URL is configured." ;;
            *) echo "ERROR: Use HTTPS before sending the token."; exit 1 ;;
          esac



      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
